# SPDX-License-Identifier: LGPL-3.0-only
name: vnote_mobile
description: "VNote managed notebooks with a native core and Markdown editor."
publish_to: 'none'
version: 0.1.0+1
resolution: workspace

environment:
  sdk: '>=3.13.7 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: 3.4.3
  webview_flutter: 4.14.1
  path_provider: 2.1.6
  archive: 4.6.0
  crypto: 3.0.8
  path: 1.9.1
  vxcore_bridge:
    path: ../../packages/vxcore_bridge

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0

flutter:
  licenses:
    - licenses/archive-4.6.0.txt
  uses-material-design: true
  assets:
    - assets/editor/
    - assets/legal/
