name: Local mobile packaging (no publication)
on:
  workflow_dispatch:
    inputs:
      platform:
        description: Target platform
        required: true
        type: choice
        options: [android, ios]
      mode:
        description: Unsigned validation is NOT an owner release
        required: true
        default: unsigned-validation
        type: choice
        options: [unsigned-validation, owner-release]
permissions:
  contents: read
concurrency:
  group: mobile-package-${{ inputs.platform }}-${{ inputs.mode }}
  cancel-in-progress: false

jobs:
  unsigned-package-validation:
    name: UNSIGNED ${{ inputs.platform }} package validation — not an owner release
    if: inputs.mode == 'unsigned-validation'
    runs-on: ${{ inputs.platform == 'ios' && 'macos-26' || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17.0.20+101'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.10'
      - run: python -m pip install --index-url https://pypi.org/simple cmake==3.29.2 ninja==1.12.0
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: 3.47.9
          channel: stable
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          cmdline-tools-version: '13114758'
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0 ndk;28.2.13676358'
          accept-android-sdk-licenses: false
          log-accepted-android-sdk-licenses: false
      - name: Select pinned Apple toolchain (iOS only)
        if: inputs.platform == 'ios'
        uses: maxim-lobanov/setup-xcode@1242409711ff5721add51979e9e11e23ebb7e5a4 # v1
        with:
          xcode-version: '26.6'
      - name: Build and inspect UNSIGNED packages, real dependency notices and SBOM
        env:
          PACKAGE_PLATFORM: ${{ inputs.platform }}
        run: node scripts/release.mjs "$PACKAGE_PLATFORM" unsigned-validation
      # Deliberately no upload-artifact, store API, or publication step.

  owner-signed-android:
    name: OWNER-SIGNED Android local APK+AAB — protected inputs required
    if: inputs.mode == 'owner-release' && inputs.platform == 'android'
    environment: mobile-release
    runs-on: [self-hosted, linux, mobile-release-android]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
      - name: Gate protected owner identity and signing, then package locally
        env:
          VNOTE_ANDROID_APPLICATION_ID: ${{ vars.VNOTE_ANDROID_APPLICATION_ID }}
          VNOTE_ANDROID_KEYSTORE: ${{ secrets.VNOTE_ANDROID_KEYSTORE_PATH }}
          VNOTE_ANDROID_KEY_ALIAS: ${{ secrets.VNOTE_ANDROID_KEY_ALIAS }}
          VNOTE_ANDROID_STORE_PASSWORD: ${{ secrets.VNOTE_ANDROID_STORE_PASSWORD }}
          VNOTE_ANDROID_KEY_PASSWORD: ${{ secrets.VNOTE_ANDROID_KEY_PASSWORD }}
          VNOTE_ANDROID_CERT_SHA256: ${{ secrets.VNOTE_ANDROID_CERT_SHA256 }}
        run: node scripts/release.mjs android owner-release

  owner-signed-ios:
    name: OWNER-SIGNED iOS local app+archive+export — protected inputs required
    if: inputs.mode == 'owner-release' && inputs.platform == 'ios'
    environment: mobile-release
    runs-on: [self-hosted, macOS, mobile-release-ios]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
      - name: Gate protected profiles, App Group and keychain identity, then archive/export locally
        env:
          VNOTE_IOS_BUNDLE_ID: ${{ vars.VNOTE_IOS_BUNDLE_ID }}
          VNOTE_IOS_EXTENSION_ID: ${{ vars.VNOTE_IOS_EXTENSION_ID }}
          VNOTE_IOS_APP_GROUP: ${{ vars.VNOTE_IOS_APP_GROUP }}
          VNOTE_IOS_TEAM_ID: ${{ secrets.VNOTE_IOS_TEAM_ID }}
          VNOTE_IOS_SIGNING_IDENTITY_SHA1: ${{ secrets.VNOTE_IOS_SIGNING_IDENTITY_SHA1 }}
          VNOTE_IOS_APP_PROFILE: ${{ secrets.VNOTE_IOS_APP_PROFILE_PATH }}
          VNOTE_IOS_EXTENSION_PROFILE: ${{ secrets.VNOTE_IOS_EXTENSION_PROFILE_PATH }}
          VNOTE_IOS_EXPORT_METHOD: ${{ vars.VNOTE_IOS_EXPORT_METHOD }}
        run: node scripts/release.mjs ios owner-release
